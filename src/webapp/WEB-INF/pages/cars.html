<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cars</title>
</head>
<body>

<h1>List Cars</h1>

<table border="1">
    <thead>
    <tr>
        <th>Model</th>
        <th>Series</th>
        <th>Years Model</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="car : ${cars}">
        <td th:text="${car.model}"></td>
        <td th:text="${car.seria}"></td>
        <td th:text="${car.yearsModel}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
